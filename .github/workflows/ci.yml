name: PHP Dlib CI 

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]
permissions:
  contents: write

jobs:

  linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.2, 8.3, 8.5]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf pkg-config cmake \
            libopenblas-dev liblapack-dev \
            libx11-dev libjpeg-dev libpng-dev

      - name: Build dlib
        run: |
          git clone https://github.com/davisking/dlib.git
          cd dlib
          mkdir build && cd build
          cmake .. -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_BUILD_TYPE=Release
          make -j2
          sudo make install
          sudo ldconfig

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config

      - name: Build extension
        run: |
          phpize
          ./configure --with-php-dlib
          make -j2

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-dlib-linux-${{ matrix.php }}
          path: |
            **/php_dlib.so


  windows:
    runs-on: windows-2022

    strategy:
      matrix:
        php-version: ["8.3", "8.4", "8.5"]
        arch: [x64]
        ts: [nts, ts]

    steps:
      - uses: actions/checkout@v4

      - name: Download dlib
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://wpdebuglog.com/wp-content/uploads/2021/10/dlib.zip" `
            -OutFile "dlib.zip"

      - name: Extract dlib
        shell: pwsh
        run: |
          Expand-Archive -Path dlib.zip -DestinationPath dlib -Force

      - name: Build PHP Extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --with-dlib=${{ github.workspace }}\dlib\dlib
          run-tests: true
          test-runner-args: "--show-diff tests"

      - name: Find and prepare DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter "*dlib*.dll" | Select-Object -First 1
          if ($dll) {
            Write-Host "Found DLL: $($dll.FullName)"
            Copy-Item $dll.FullName "php_dlib.dll"
          } else {
            Write-Error "DLL not found!"
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-dlib-windows-${{ matrix.php-version }}-${{ matrix.ts }}
          path: php_dlib.dll


  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Create GitHub Release + Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}