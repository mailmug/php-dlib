name: PHP Dlib CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.2, 8.3, 8.5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            pkg-config \
            cmake \
            libopenblas-dev \
            liblapack-dev \
            libx11-dev \
            libjpeg-dev \
            libpng-dev

      - name: Build and install dlib from source (PIC enabled)
        run: |
          git clone https://github.com/davisking/dlib.git
          cd dlib
          mkdir build
          cd build

          cmake .. \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DDLIB_USE_CUDA=OFF \
            -DUSE_AVX_INSTRUCTIONS=ON \
            -DCMAKE_BUILD_TYPE=Release

          make -j2
          sudo make install
          sudo ldconfig

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: none
          ini-values: zend.assertions=1, display_errors=On
          tools: phpize, php-config

      - name: Build extension
        run: |
          phpize
          ./configure
          make -j2

      - name: Run tests
        run: |
          make test || true