name: PHP Dlib 

on:
  push:
    branches: ["main"]
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:

  linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf pkg-config cmake \
            libopenblas-dev liblapack-dev \
            libx11-dev libjpeg-dev libpng-dev

      - name: Build dlib
        run: |
          git clone --branch v20.0.1 --depth 1 https://github.com/davisking/dlib.git
          cd dlib
          mkdir build && cd build
          cmake .. -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_BUILD_TYPE=Release
          make -j2
          sudo make install
          sudo ldconfig

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config

      - name: Build extension
        run: |
          phpize
          ./configure --with-php-dlib
          make -j2

      - name: Prepare Linux artifact
        run: |
          FILE=$(find . -name "php_dlib.so" | head -n 1)
          mkdir -p dist
          mv "$FILE" dist/php-dlib-linux-${{ matrix.php }}.so

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-dlib-linux-${{ matrix.php }}
          path: dist/*.so


  windows:
    runs-on: windows-2022

    strategy:
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        arch: [x64]
        ts: [nts, ts]

    steps:
      - uses: actions/checkout@v4

      - name: Download dlib
        shell: pwsh
        run: |
          git clone --branch v20.0.1 --depth 1 https://github.com/davisking/dlib.git dlib

      - name: Prepare dlib
        shell: pwsh
        run: |
          cmake -S dlib -B dlib\build `
            -DCMAKE_BUILD_TYPE=Release

          New-Item -ItemType Directory -Force -Path "dlib\include" | Out-Null

          Copy-Item `
            "dlib\dlib" `
            "dlib\include\dlib" `
            -Recurse `
            -Force

          # Copy generated dlib headers.
          if (Test-Path "dlib\build\dlib\revision.h") {
            Copy-Item `
              "dlib\build\dlib\revision.h" `
              "dlib\include\dlib\revision.h" `
              -Force
          }

          Write-Host "Checking dlib headers..."

          if (-not (Test-Path "dlib\include\dlib\dnn.h")) {
            Write-Error "dnn.h not found!"
            exit 1
          }

          if (-not (Test-Path "dlib\include\dlib\revision.h")) {
            Write-Error "revision.h not found!"
            exit 1
          }

          Write-Host "Found dnn.h"
          Write-Host "Found revision.h"

      - name: Build PHP Extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --with-dlib=${{ github.workspace }}\dlib
          run-tests: true
          test-runner-args: "--show-diff tests"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-dlib-windows-${{ matrix.php-version }}-${{ matrix.ts }}
          path: dist/*.dll

  macos:
    runs-on: macos-latest

    strategy:
      matrix:
        php: [8.2, 8.3, 8.4, 8.5]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install cmake openblas jpeg libpng

      - name: Build dlib
        run: |
          git clone --branch v20.0.1 --depth 1 https://github.com/davisking/dlib.git
          cd dlib
          mkdir build && cd build
          cmake .. -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_BUILD_TYPE=Release
          make -j2
          sudo make install

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config

      - name: Build extension
        run: |
          phpize
          ./configure --with-php-dlib
          make -j2

      - name: Prepare macOS artifact
        run: |
          FILE=$(find . -name "php_dlib.so" | head -n 1)
          mkdir -p dist
          mv "$FILE" dist/php-dlib-macos-${{ matrix.php }}.so

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-dlib-macos-${{ matrix.php }}
          path: dist/*.so

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Clean unwanted files
        run: |
          find artifacts -type f \( \
            -name "php_php_dlib*" -o \
            -name "*.log" -o \
            -name "*.zip" \
          \) -delete

          echo "Cleaned artifacts:"
          ls -R artifacts

      - name: Create GitHub Release + Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            artifacts/*.so
            artifacts/*.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
